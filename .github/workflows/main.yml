name: 주간 자동 갱신

on:
  schedule:
    # 토요일 13:00 UTC = 한국시간 토요일 밤 10시
    # 추첨(오후 8시 45분)이 끝나고 한 시간 넘게 지난 시점이라 결과가 확실히 올라와 있다.
    # GitHub 사정으로 10~30분 늦게 시작될 수 있으나 결과에는 영향이 없다.
    - cron: '0 13 * * 6'
  # Actions 탭에서 수동으로도 돌릴 수 있게 한다 (첫 실행과 문제 확인용)
  workflow_dispatch:

permissions:
  contents: write        # draws.csv 에 새 회차를 커밋하기 위해 필요
  pages: write           # 페이지 배포
  id-token: write        # 배포 인증

# 갱신이 겹쳐 돌지 않게 한다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 새 회차 반영 및 페이지 생성
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        # 외부 패키지를 쓰지 않으므로 pip install 단계가 없다

      - name: 동행복권에서 새 회차 받아오기
        run: python update_draws.py

      - name: 새 회차를 저장소에 기록
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.csv
          if git diff --staged --quiet; then
            echo "회차 변경 없음 — 커밋 생략"
          else
            git commit -m "회차 데이터 갱신"
            git push
          fi

      - name: 조합 새로 뽑아 페이지 생성
        run: python build_site.py

      - name: 페이지 설정 확인
        uses: actions/configure-pages@v5

      - name: 결과물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 페이지 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
